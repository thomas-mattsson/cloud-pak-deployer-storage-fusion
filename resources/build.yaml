---
apiVersion: v1
kind: Namespace
metadata:
  creationTimestamp: null
  name: cloud-pak-deployer
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: cloud-pak-deployer
  namespace: cloud-pak-deployer
spec:
  lookupPolicy:
    local: true
---
kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: cloud-pak-deployer
  namespace: cloud-pak-deployer
spec:
  source:
    type: Git
    git:
      uri: 'https://github.com/IBM/cloud-pak-deployer'
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile.ppc64le
      imageOptimizationPolicy: SkipLayers
      buildArgs:
        - name: CPD_OLM_UTILS_V3_IMAGE
          value: 'icr.io/cpopen/cpd/olm-utils-v3:latest.ppc64le'
        - name: CPD_OLM_UTILS_V4_IMAGE
          value: 'icr.io/cpopen/cpd/olm-utils-v4:5.4.0.ppc64le'
  triggers:
    - type: ConfigChange
  output:
    to:
      kind: ImageStreamTag
      name: 'cloud-pak-deployer:latest'

